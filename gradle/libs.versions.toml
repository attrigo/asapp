[versions]
# Build
## Other
asciidoctorj = "3.0.0"
jacoco = "0.8.14"
picocli = "4.7.7" # Required by Liquibase's CLI, which doesn't pull it in

# Plugin
## Spring
spring-dependency-management = "1.1.7"
## Other
asciidoctor-gradle = "4.0.5"
cyclonedx-gradle = "3.3.0" # Never below 3.2.0 — 3.0.1 ships a stale SBOM
gradle-git-properties = "4.0.1"
gradle-pitest = "1.19.0"
liquibase-gradle = "3.1.0"
spotless = "8.8.0"

# BOM
## Spring Boot
spring-boot = "4.0.5"
## Spring Cloud
spring-cloud = "2025.1.1"

# Compile
## Other
bootui = "1.4.0"
mapstruct = "1.6.3"
nimbus-jose-jwt = "9.37.4"
resilience4j = "2.4.0"
springdoc-openapi-starter = "3.0.2"

# Test
## Spring
spring-restdocs = "4.0.0"
## Other
archunit = "1.4.2"
json-unit-assertj = "5.1.1"
mockserver = "5.15.0"
pitest = "1.25.8"
pitest-junit5-plugin = "1.2.3"
testcontainers = "2.0.4"
testcontainers-redis = "2.2.4"

# CVE
## Other
bcpkix-jdk18on = "1.84"
bcprov-jdk18on = "1.84"
commons-beanutils = "1.11.0"
commons-io = "2.21.0"
guava = "33.4.8-jre"
jackson-bom = "3.1.1" # Overrides the Spring Boot BOM's version
rhino = "1.9.1"

[libraries]
# Build
## Other
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }

# Plugin
## Spring Boot
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
## Spring
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
## Other
asciidoctor-gradle-plugin = { module = "org.asciidoctor:asciidoctor-gradle-jvm", version.ref = "asciidoctor-gradle" }
cyclonedx-gradle-plugin = { module = "org.cyclonedx:cyclonedx-gradle-plugin", version.ref = "cyclonedx-gradle" }
gradle-git-properties-plugin = { module = "com.gorylenko.gradle-git-properties:gradle-git-properties", version.ref = "gradle-git-properties" }
gradle-pitest-plugin = { module = "info.solidsoft.gradle.pitest:gradle-pitest-plugin", version.ref = "gradle-pitest" }
liquibase-gradle-plugin = { module = "org.liquibase:liquibase-gradle-plugin", version.ref = "liquibase-gradle" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

# BOM
## Spring Boot
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Compile
## Other
bootui-spring-boot-starter = { module = "com.julien-dubois.bootui:bootui-spring-boot-starter", version.ref = "bootui" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi-starter" }

# Test
## Spring
spring-restdocs-asciidoctor = { module = "org.springframework.restdocs:spring-restdocs-asciidoctor", version.ref = "spring-restdocs" }
spring-restdocs-mockmvc = { module = "org.springframework.restdocs:spring-restdocs-mockmvc", version.ref = "spring-restdocs" }
## Other
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson-bom" }
json-unit-assertj = { module = "net.javacrumbs.json-unit:json-unit-assertj", version.ref = "json-unit-assertj" }
mockserver-client-java = { module = "org.mock-server:mockserver-client-java", version.ref = "mockserver" }
mockserver-netty = { module = "org.mock-server:mockserver-netty", version.ref = "mockserver" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-mockserver = { module = "org.testcontainers:testcontainers-mockserver", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version.ref = "testcontainers-redis" }

# CVE
## Other
bcpkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bcpkix-jdk18on" }
bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bcprov-jdk18on" }
commons-beanutils = { module = "commons-beanutils:commons-beanutils", version.ref = "commons-beanutils" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }

[bundles]
# Test
testcontainers-shared = [
    "testcontainers-junit-jupiter",
    "testcontainers-postgresql",
    "testcontainers-redis",
]
