group=com.attrigo.asapp
version=0.6.0-SNAPSHOT

org.gradle.caching=true
# org.gradle.configuration-cache: deferred — asciidoctor is the only verified blocker, holding a Project and a
# Configuration the task graph cannot serialize (asciidoctor-gradle-plugin#564 fixes it, but only in the
# unreleased 5.0 line; #677 was closed not-planned)
# org.gradle.jvmargs: unset deliberately — a value replaces Gradle's defaults rather than adding to them, so
# restate them if you ever set it; compiler encoding is set per-task on JavaCompile, not here
org.gradle.parallel=true

# Namespaces the plugin's generated tasks: update -> liquibaseUpdate
liquibaseTaskPrefix=liquibase
